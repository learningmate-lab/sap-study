<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SAP ABAP·Fiori AI 스터디</title>
<!-- Pretendard Variable 1.3.9 is vendored (assets/vendor/PretendardVariable.woff2, @font-face in app.css) -->
<link rel="stylesheet" href="assets/app.css">
<script>
  // apply saved theme before paint
  (function () { try { var t = localStorage.getItem('sapai:theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
<style>
  .gate { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; padding: 16px; background: var(--bg); }
  .gate[hidden] { display: none; }
  .gate-card { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 24px 22px; color: var(--text); }
  .gate-card h1 { margin: 0 0 4px; font-size: 20px; display: flex; align-items: center; gap: 8px; }
  .gate-card p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .gate-card input[type=password] { width: 100%; box-sizing: border-box; padding: 11px 12px; font-size: 15px; border: 1px solid var(--line); border-radius: 10px; background: var(--inset); color: var(--text); }
  .gate-card input[type=password]:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .gate-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
  .gate-card label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text-2); cursor: pointer; }
  .gate-card button { border: 0; border-radius: 10px; padding: 10px 18px; font-size: 15px; font-weight: 700; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .gate-card button:disabled { opacity: .6; cursor: progress; }
  .gate-err { min-height: 20px; margin-top: 12px; font-size: 13.5px; color: var(--err); }
  .gate-err.info { color: var(--muted); }
  #btnLock { width: auto; padding: 0 10px; font-size: 13px; gap: 4px; }
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gateForm" autocomplete="off">
    <h1>🔒 AI 스터디</h1>
    <p>비밀번호를 입력하면 강의자료가 열려요.</p>
    <input id="gatePw" type="password" placeholder="비밀번호" aria-label="비밀번호" autocomplete="current-password" required>
    <div class="gate-row">
      <label><input type="checkbox" id="gateRemember"> 이 기기에서 기억하기</label>
      <button type="submit" id="gateBtn">열기</button>
    </div>
    <div class="gate-err" id="gateErr" role="alert"></div>
  </form>
</div>
<div id="app">
  <header class="topbar">
    <button class="icon-btn only-narrow" id="btnMenu" title="장 목록" aria-label="장 목록">☰</button>
    <div class="brand"><span class="brand-dot"></span><b>AI 스터디</b><span class="brand-sub">SAP ABAP · Fiori</span></div>
    <div class="seg" id="subjectSeg" role="tablist"></div>
    <div class="spacer"></div>
    <div class="usage" id="usage" title="이번 세션에서 쓴 토큰과 예상 비용 (API usage 기준)">0 tok · $0.000</div>
    <button class="icon-btn" id="btnLock" title="잠금 — 이 기기에 기억한 비밀번호 키를 지우고 잠가요" aria-label="잠금">🔒 잠금</button>
    <button class="icon-btn" id="btnTheme" title="테마 전환" aria-label="테마 전환">◐</button>
    <button class="icon-btn" id="btnSettings" title="설정 (API 키·모델)" aria-label="설정">⚙</button>
  </header>

  <div class="main">
    <aside class="sidebar" id="sidebar">
      <div class="side-title" id="sideTitle">장 목록</div>
      <nav id="chapterList"></nav>
      <div class="side-foot">강의자료는 암호화돼 있어요.<br>API 키는 이 브라우저에만 저장돼요.</div>
    </aside>

    <section class="content" id="content">
      <div class="ch-head">
        <div>
          <div class="ch-kicker" id="chKicker"></div>
          <h1 class="ch-title" id="chTitle">불러오는 중…</h1>
        </div>
        <div class="tabs" id="tabs" role="tablist"></div>
      </div>
      <div class="view" id="view"></div>
    </section>

    <div class="resizer" id="resizer" title="드래그해서 채팅창 너비 조절"></div>

    <aside class="chat" id="chat">
      <div class="chat-head">
        <div class="chat-title"><span class="spark">✦</span> AI 튜터 <span class="chat-scope" id="chatScope"></span></div>
        <div class="chat-actions">
          <button class="chip-btn" id="btnQuiz" title="튜터가 이 장으로 5문제 퀴즈를 내요">퀴즈 5문제</button>
          <button class="icon-btn sm" id="btnNewChat" title="새 대화">＋</button>
          <button class="icon-btn sm" id="btnExport" title="대화를 마크다운으로 내보내기">⤓</button>
          <button class="icon-btn sm" id="btnDelChat" title="이 장 대화 삭제">🗑</button>
          <button class="icon-btn sm only-narrow" id="btnCloseChat" title="닫기">✕</button>
        </div>
      </div>
      <div class="chat-log" id="chatLog"></div>
      <div class="composer">
        <div class="ctx-tray" id="ctxTray"></div>
        <div class="quick" id="quick"></div>
        <div class="input-row">
          <textarea id="input" rows="2" placeholder="궁금한 걸 물어보세요 (Enter 전송 · Shift+Enter 줄바꿈)"></textarea>
          <button class="send" id="btnSend" title="보내기">↑</button>
        </div>
        <div class="composer-foot" id="composerFoot"></div>
      </div>
    </aside>
  </div>

  <button class="fab only-narrow" id="fabChat">✦ 튜터</button>
  <button class="sel-ask" id="selAsk" hidden>✦ 질문하기</button>
</div>

<div class="modal" id="settingsModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="modal-head"><h2 id="setTitle">설정</h2><button class="icon-btn sm" data-close>✕</button></div>
    <label class="field"><span>Anthropic API 키</span>
      <div class="key-row"><input id="setKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-..."><button class="ghost" id="btnShowKey" type="button">보기</button></div>
      <small>키는 <b>이 브라우저의 localStorage에만</b> 저장돼요. 파일이나 다른 곳으로 보내지 않고, 요청할 때 api.anthropic.com에만 직접 보내요.</small>
    </label>
    <label class="field"><span>모델</span>
      <select id="setModel"></select>
    </label>
    <label class="field"><span>답변 깊이 (effort)</span>
      <select id="setEffort">
        <option value="auto">자동 (추천) — 질문에 맞춰 빠르게/보통</option>
        <option value="low">빠르게 (low) 고정 — 저렴</option>
        <option value="medium">보통 (medium) 고정</option>
        <option value="high">깊게 (high) 고정</option>
      </select>
      <small>깊을수록 더 오래 생각하고 토큰을 더 써요. 보통은 자동이 가장 경제적이에요.</small>
    </label>
    <p class="set-note">🤖 <b>자동</b>이면 질문마다 알아서 골라요: 짧은 개념·채점 질문은 <b>Haiku</b>(아주 저렴), 그림·코드·원리·비교·이미지 질문은 <b>Sonnet</b>. 답변 아래 <b>↻ 더 깊게 다시 답하기</b>를 누르면 Opus로 다시 답해요.</p>
    <label class="check"><input type="checkbox" id="setThinking"> 튜터의 '생각 요약' 보이기</label>
    <div class="modal-actions">
      <button class="ghost" id="btnTestKey" type="button">연결 테스트</button>
      <button class="ghost danger" id="btnClearKey" type="button">키 삭제</button>
      <div class="spacer"></div>
      <button class="primary" id="btnSaveSettings" type="button">저장</button>
    </div>
    <div class="test-result" id="testResult"></div>
  </div>
</div>

<div class="modal" id="lightbox" hidden>
  <div class="lightbox-card">
    <div class="modal-head"><b id="lbTitle"></b><div class="spacer"></div><button class="ghost" id="lbGo">그 장으로 이동</button><button class="icon-btn sm" data-close>✕</button></div>
    <img id="lbImg" alt="">
    <div id="lbSvg" class="lb-svg" hidden></div>
  </div>
</div>

<!-- libraries (pinned) -->
<script src="assets/vendor/marked.min.js"></script>
<script src="assets/vendor/purify.min.js"></script>
<script src="assets/vendor/highlight.min.js"></script>
<script src="assets/vendor/properties.min.js"></script>
<script src="assets/hl-abap.js"></script>
<!-- mermaid 10.9.1 is loaded lazily from assets/vendor/mermaid.min.js -->
<script>
(function () {
  'use strict';
  var SALT = 'GYd64gsXoThUcqzqYELDOQ==', ITER = 600000, LS = 'sapai:vault';
  var subtle = window.crypto && window.crypto.subtle, KEY = null;
  var gate = document.getElementById('gate'), form = document.getElementById('gateForm'), pw = document.getElementById('gatePw'),
    rem = document.getElementById('gateRemember'), btn = document.getElementById('gateBtn'), err = document.getElementById('gateErr');
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function ub64(buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function bin(src) { return src.replace(/\.js$/, '.bin'); }
  function decrypt(key, buf) { var u = new Uint8Array(buf); return subtle.decrypt({ name: 'AES-GCM', iv: u.subarray(0, 12) }, key, u.subarray(12)); }
  function fetchDec(key, url) {
    return fetch(url, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('불러오기 실패: ' + url + ' (' + r.status + ')'); return r.arrayBuffer(); })
      .then(function (buf) { return decrypt(key, buf); });
  }
  function verify(key) { return fetchDec(key, 'assets/check.bin').then(function (p) { return new TextDecoder().decode(p) === 'SAPAI-CHECK-1'; }, function (e) { if (e && e.name === 'OperationError') return false; throw e; }); }
  // decrypt a packed script and run it via a Blob URL; resolves after it executed
  window.SAPAI_LOAD = function (src) {
    if (!KEY) return Promise.reject(new Error('잠겨 있어요'));
    return fetchDec(KEY, bin(src)).then(function (plain) {
      return new Promise(function (res, rej) {
        var url = URL.createObjectURL(new Blob([plain], { type: 'text/javascript' }));
        var s = document.createElement('script'); s.src = url; s.async = false;
        s.onload = function () { URL.revokeObjectURL(url); res(); };
        s.onerror = function () { URL.revokeObjectURL(url); rej(new Error('불러오기 실패: ' + src)); };
        document.head.appendChild(s);
      });
    });
  };
  function boot() {
    gate.hidden = true;
    var chain = Promise.resolve();
    ['assets/data/manifest.js', 'assets/quiz.js', 'assets/app.js'].forEach(function (s) { chain = chain.then(function () { return window.SAPAI_LOAD(s); }); });
    return chain.catch(function (e) { console.error(e); showGate(e.message || String(e)); });
  }
  function showGate(msg, info) { gate.hidden = false; err.textContent = msg || ''; err.className = 'gate-err' + (info ? ' info' : ''); btn.disabled = false; btn.textContent = '열기'; setTimeout(function () { pw.focus(); }, 0); }
  function forget() { try { localStorage.removeItem(LS); } catch (e) { } }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!subtle) return showGate('이 브라우저는 암호 해제(Web Crypto)를 지원하지 않아요. HTTPS 주소로 열어 주세요.');
    var p = pw.value; if (!p) return;
    btn.disabled = true; btn.textContent = '확인 중…'; err.textContent = '';
    subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) { return subtle.deriveKey({ name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']); })
      .then(function (key) {
        return verify(key).then(function (ok) {
          if (!ok) { pw.select(); return showGate('비밀번호가 맞지 않아요. 다시 입력해 주세요.'); }
          KEY = key; pw.value = '';
          if (rem.checked) return subtle.exportKey('raw', key).then(function (raw) { try { localStorage.setItem(LS, JSON.stringify({ salt: SALT, key: ub64(raw) })); } catch (e) { } }).then(boot);
          forget(); return boot();
        });
      })
      .catch(function (e) { console.error(e); showGate('열지 못했어요: ' + (e.message || e)); });
  });
  document.getElementById('btnLock').addEventListener('click', function () { forget(); KEY = null; location.reload(); });
  // remembered key (raw AES key only, never the password)
  var saved = null; try { saved = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { }
  if (subtle && saved && saved.salt === SALT && saved.key) {
    subtle.importKey('raw', b64(saved.key), { name: 'AES-GCM' }, true, ['decrypt'])
      .then(function (key) { return verify(key).then(function (ok) { if (!ok) { forget(); return showGate(); } KEY = key; rem.checked = true; return boot(); }); })
      .catch(function (e) { console.error(e); showGate('저장된 키로 열지 못했어요. 비밀번호를 다시 입력해 주세요.', true); });
  } else { if (saved) forget(); showGate(); }
})();
</script>
</body>
</html>
